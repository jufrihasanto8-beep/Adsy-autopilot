<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Adsy Autopilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #2563EB; --primary-dark: #1D4ED8;
      --gray-1: #F8FAFC; --gray-2: #F1F5F9; --gray-3: #E2E8F0;
      --gray-5: #94A3B8; --gray-6: #64748B;
      --text: #1A1A2E; --danger: #EF4444;
      --radius: 16px; --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--gray-1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-bg {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #EFF6FF 0%, #F8FAFC 50%, #F0FDF4 100%);
      z-index: -1;
    }
    .login-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.4;
    }
    .blob-1 { width: 400px; height: 400px; background: #BFDBFE; top: -100px; left: -100px; }
    .blob-2 { width: 300px; height: 300px; background: #DDD6FE; bottom: -80px; right: -80px; }

    .login-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      padding: 40px;
    }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .login-logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #2563EB, #7C3AED);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .login-logo-text strong {
      display: block;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
    }
    .login-logo-text span {
      font-size: 12px;
      color: var(--gray-6);
    }
    .login-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }
    .login-sub {
      font-size: 13px;
      color: var(--gray-6);
      margin-bottom: 28px;
    }
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--gray-3);
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--text);
      background: white;
      transition: all 0.2s;
      outline: none;
      font-family: inherit;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .form-input::placeholder { color: var(--gray-5); }
    .password-wrap { position: relative; }
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--gray-5);
      font-size: 16px;
      background: none;
      border: none;
    }
    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--primary), #7C3AED);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error-msg {
      background: #FEF2F2;
      color: var(--danger);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 13px;
      margin-top: 14px;
      display: none;
    }
    .loading-spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--gray-5);
    }
  </style>
</head>
<body>
  <div class="login-bg"></div>
  <div class="login-blob blob-1"></div>
  <div class="login-blob blob-2"></div>

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">🚀</div>
      <div class="login-logo-text">
        <strong>Adsy Autopilot</strong>
        <span>Meta Ads Automation</span>
      </div>
    </div>

    <h1 class="login-title">Selamat datang!</h1>
    <p class="login-sub">Masuk ke dashboard autopilot iklan kamu.</p>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="nama@email.com" required />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" class="form-input" placeholder="••••••••" required />
          <button type="button" class="password-toggle" id="toggle-pass">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="btn-login">
        Masuk
      </button>
      <div class="error-msg" id="error-msg"></div>
    </form>

    <div class="login-footer">© 2025 Adsy · Internal Tool</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Check if already logged in
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = '/dashboard.html';
    });

    // Password toggle
    document.getElementById('toggle-pass').addEventListener('click', () => {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    // Login form
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const errorEl = document.getElementById('error-msg');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerHTML = '<div class="loading-spinner"></div> Masuk...';
      errorEl.style.display = 'none';

      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorEl.textContent = 'Email atau password salah. Coba lagi.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = 'Masuk';
      }
    });
  </script>
</body>
</html>
