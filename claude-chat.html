<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Claude Chat — Adsy Autopilot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/x-icon" href="/assets/autopilot.ico"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sb-bg: #171717;
      --sb-hover: #262626;
      --sb-active: #303030;
      --sb-text: #e5e5e5;
      --sb-sub: #737373;
      --sb-border: rgba(255,255,255,0.08);
      --main-bg: #ffffff;
      --text-main: #0a0a0a;
      --text-sub: #737373;
      --border: #e5e5e5;
      --user-bubble: #f5f5f5;
      --primary: #d97706;
      --send-bg: #171717;
      --send-hover: #404040;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--main-bg);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ─── SIDEBAR ─── */
    .csb {
      width: 260px;
      min-width: 260px;
      background: var(--sb-bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      transition: transform 0.25s;
    }

    .csb-head {
      padding: 14px 12px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--sb-border);
      flex-shrink: 0;
    }

    .csb-logo {
      width: 30px; height: 30px;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .csb-logo-text {
      color: var(--sb-text);
      font-size: 14px;
      font-weight: 600;
      flex: 1;
    }

    .csb-back {
      background: none;
      border: none;
      color: var(--sb-sub);
      font-size: 16px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      text-decoration: none;
      display: flex; align-items: center;
    }
    .csb-back:hover { color: var(--sb-text); background: var(--sb-hover); }

    .btn-new {
      margin: 10px 10px 4px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: var(--sb-text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
      width: calc(100% - 20px);
      flex-shrink: 0;
    }
    .btn-new:hover { background: rgba(255,255,255,0.13); }
    .btn-new-icon { font-size: 15px; }

    .conv-label {
      padding: 10px 14px 4px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--sb-sub);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      flex-shrink: 0;
    }

    .conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 2px 6px 6px;
    }
    .conv-list::-webkit-scrollbar { width: 3px; }
    .conv-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
      position: relative;
    }
    .conv-item:hover { background: var(--sb-hover); }
    .conv-item.active { background: var(--sb-active); }

    .conv-icon { font-size: 13px; flex-shrink: 0; color: var(--sb-sub); }

    .conv-title {
      flex: 1;
      font-size: 13px;
      color: var(--sb-sub);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.12s;
    }
    .conv-item:hover .conv-title,
    .conv-item.active .conv-title { color: var(--sb-text); }

    .conv-del {
      display: none;
      background: none;
      border: none;
      color: var(--sb-sub);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 5px;
      border-radius: 4px;
      flex-shrink: 0;
      transition: color 0.12s, background 0.12s;
    }
    .conv-item:hover .conv-del { display: flex; align-items: center; }
    .conv-del:hover { color: #f87171; background: rgba(248,113,113,0.1); }

    .conv-empty {
      padding: 20px 14px;
      font-size: 12px;
      color: var(--sb-sub);
      text-align: center;
      line-height: 1.6;
    }

    .csb-foot {
      padding: 12px;
      border-top: 1px solid var(--sb-border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .csb-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 13px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .csb-uname {
      flex: 1;
      font-size: 13px;
      color: var(--sb-text);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ─── MAIN ─── */
    .cmain {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      min-width: 0;
    }

    /* Welcome */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 200px;
      gap: 6px;
    }

    .welcome-logo {
      width: 56px; height: 56px;
      border-radius: 50%;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .welcome-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .welcome-sub {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 28px;
    }

    .welcome-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 580px;
    }

    .chip {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 13px;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.15s;
      background: white;
      font-family: inherit;
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); background: rgba(217,119,6,0.04); }

    /* Messages */
    .msgs-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
      scroll-behavior: smooth;
    }
    .msgs-wrap::-webkit-scrollbar { width: 5px; }
    .msgs-wrap::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

    .msg-row {
      display: flex;
      gap: 14px;
      padding: 6px 28px;
      max-width: 860px;
      margin: 0 auto;
      width: 100%;
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-av {
      width: 34px; height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      font-weight: 700;
      margin-top: 1px;
    }

    .msg-av.av-user { background: var(--primary); color: white; font-size: 12px; }
    .msg-av.av-claude { background: linear-gradient(135deg, #d97706, #92400e); color: white; }

    .msg-body { flex: 1; min-width: 0; }

    /* User bubble */
    .msg-row.user .msg-body {
      background: var(--user-bubble);
      padding: 10px 16px;
      border-radius: 18px 18px 4px 18px;
      max-width: 82%;
      align-self: flex-start;
    }

    .msg-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 5px;
    }
    .msg-row.user .msg-name { display: none; }

    .msg-text {
      font-size: 14.5px;
      line-height: 1.75;
      color: var(--text-main);
    }

    /* Markdown inside msg-text */
    .msg-text p { margin-bottom: 12px; }
    .msg-text p:last-child { margin-bottom: 0; }
    .msg-text h1 { font-size: 20px; font-weight: 700; margin: 18px 0 8px; }
    .msg-text h2 { font-size: 17px; font-weight: 700; margin: 16px 0 6px; }
    .msg-text h3 { font-size: 15px; font-weight: 600; margin: 14px 0 5px; }
    .msg-text ul, .msg-text ol { padding-left: 22px; margin-bottom: 12px; }
    .msg-text li { margin-bottom: 5px; line-height: 1.65; }
    .msg-text strong { font-weight: 600; }
    .msg-text em { font-style: italic; }
    .msg-text a { color: var(--primary); text-decoration: underline; }
    .msg-text blockquote {
      border-left: 3px solid #e5e5e5;
      padding-left: 14px;
      color: var(--text-sub);
      margin: 12px 0;
      font-style: italic;
    }
    .msg-text hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    .msg-text table { border-collapse: collapse; width: 100%; margin-bottom: 12px; font-size: 13.5px; }
    .msg-text th, .msg-text td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    .msg-text th { background: #f5f5f5; font-weight: 600; }

    /* Inline code */
    .msg-text code {
      background: #f0f0f0;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 13px;
      font-family: 'Fira Code', 'Cascadia Code', monospace;
    }

    /* Code block */
    .msg-text pre {
      background: #1e1e1e;
      border-radius: 10px;
      margin: 12px 0;
      overflow: hidden;
    }

    .code-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .code-lang-label {
      font-size: 11px;
      color: #8b8b8b;
      text-transform: lowercase;
      font-family: 'Fira Code', monospace;
    }

    .code-cp-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 5px;
      color: #8b8b8b;
      font-size: 11px;
      padding: 2px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .code-cp-btn:hover { background: rgba(255,255,255,0.1); color: #e5e5e5; }

    .msg-text pre code {
      background: none;
      padding: 14px 16px;
      display: block;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.65;
      color: #e5e5e5;
      border-radius: 0;
    }

    /* Thinking dots */
    .thinking {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 6px 0;
    }
    .td {
      width: 7px; height: 7px;
      background: #d1d5db;
      border-radius: 50%;
      animation: tdPulse 1.4s ease-in-out infinite;
    }
    .td:nth-child(2) { animation-delay: 0.2s; }
    .td:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tdPulse {
      0%, 60%, 100% { transform: scale(0.7); opacity: 0.5; }
      30% { transform: scale(1); opacity: 1; }
    }

    /* Message actions */
    .msg-acts {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .msg-row:hover .msg-acts { opacity: 1; }

    .msg-act {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 11.5px;
      color: var(--text-sub);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }
    .msg-act:hover { background: #f5f5f5; color: var(--text-main); }

    /* Fade in animation */
    .msg-fadein { animation: mfi 0.25s ease; }
    @keyframes mfi {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── INPUT ─── */
    .input-wrap {
      padding: 14px 24px 20px;
      background: var(--main-bg);
      flex-shrink: 0;
    }

    .input-inner {
      max-width: 720px;
      margin: 0 auto;
    }

    .input-box {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px;
      border: 1.5px solid #e0e0e0;
      border-radius: 16px;
      padding: 10px 10px 10px 10px;
      background: white;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(217,119,6,0.1);
    }

    #ci {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-size: 14.5px;
      line-height: 1.6;
      font-family: inherit;
      color: var(--text-main);
      background: transparent;
      max-height: 200px;
      min-height: 22px;
    }
    #ci::placeholder { color: #b0b0b0; }

    #sbtn {
      width: 36px; height: 36px;
      background: var(--send-bg);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 19px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    #sbtn:hover:not(:disabled) { background: var(--send-hover); }
    #sbtn:active:not(:disabled) { transform: scale(0.93); }
    #sbtn:disabled { background: #d1d5db; cursor: not-allowed; }

    .input-foot {
      text-align: center;
      font-size: 11.5px;
      color: #c0c0c0;
      margin-top: 8px;
    }

    /* ─── PLUS MENU ─── */
    .plus-wrap { position: relative; flex-shrink: 0; }

    #plus-btn {
      width: 34px; height: 34px;
      background: none;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      color: #6b7280;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      line-height: 1;
    }
    #plus-btn:hover { border-color: var(--primary); color: var(--primary); background: rgba(217,119,6,0.04); }

    .plus-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 6px;
      min-width: 220px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
      z-index: 100;
    }

    .pm-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13.5px;
      color: #374151;
      transition: background 0.12s;
      position: relative;
    }
    .pm-item:hover { background: #f3f4f6; }
    .pm-item-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
    .pm-item-text { flex: 1; }
    .pm-item-kbd { font-size: 11px; color: #9ca3af; background: #f3f4f6; padding: 1px 6px; border-radius: 4px; }
    .pm-item-arrow { color: #9ca3af; font-size: 11px; }
    .pm-divider { height: 1px; background: #f3f4f6; margin: 4px 0; }

    /* Skills submenu */
    .skills-sub {
      position: absolute;
      bottom: 0;
      left: calc(100% + 6px);
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 6px;
      min-width: 220px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      z-index: 101;
    }
    .ss-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .ss-item:hover { background: #f3f4f6; }
    .ss-icon { font-size: 14px; width: 20px; flex-shrink: 0; margin-top: 1px; }
    .ss-name { font-size: 13px; font-weight: 600; color: #111827; }
    .ss-desc { font-size: 11.5px; color: #6b7280; margin-top: 1px; }

    .ss-divider { height: 1px; background: #f3f4f6; margin: 4px 0; }
    .ss-action {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #6b7280;
      transition: background 0.12s;
    }
    .ss-action:hover { background: #f3f4f6; color: #374151; }

    /* ─── MANAGE SKILLS MODAL ─── */
    .sk-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 300;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .sk-modal {
      background: white;
      border-radius: 18px;
      width: 100%;
      max-width: 560px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .sk-modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px 14px;
      border-bottom: 1px solid #f3f4f6;
      flex-shrink: 0;
    }
    .sk-modal-title { font-size: 16px; font-weight: 700; color: #111827; }
    .sk-modal-close {
      background: none; border: none; font-size: 20px; color: #9ca3af;
      cursor: pointer; padding: 2px 6px; border-radius: 6px;
      transition: color 0.12s, background 0.12s;
    }
    .sk-modal-close:hover { background: #f3f4f6; color: #374151; }
    .sk-modal-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .sk-modal-foot {
      padding: 14px 20px;
      border-top: 1px solid #f3f4f6;
      flex-shrink: 0;
    }

    /* skill cards in modal */
    .sk-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex; align-items: flex-start; gap: 12px;
      transition: border-color 0.12s;
    }
    .sk-card:hover { border-color: #d1d5db; }
    .sk-card-icon { font-size: 22px; flex-shrink: 0; }
    .sk-card-info { flex: 1; min-width: 0; }
    .sk-card-name { font-size: 13.5px; font-weight: 600; color: #111827; }
    .sk-card-desc { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .sk-card-badge {
      font-size: 10px; padding: 1px 7px; border-radius: 100px;
      background: #f3f4f6; color: #9ca3af; flex-shrink: 0;
    }
    .sk-card-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .sk-card-btn {
      background: none; border: 1px solid #e5e7eb; border-radius: 7px;
      padding: 3px 10px; font-size: 12px; color: #6b7280;
      cursor: pointer; font-family: inherit;
      transition: all 0.12s;
    }
    .sk-card-btn:hover { background: #f9fafb; border-color: #d1d5db; color: #374151; }
    .sk-card-btn.del:hover { border-color: #fca5a5; color: #ef4444; background: #fef2f2; }

    /* Add skill form */
    .sk-form {
      border: 1.5px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      margin-top: 4px;
    }
    .sk-form-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .sk-form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .sk-form-group.icon-group { flex: 0 0 72px; }
    .sk-label { font-size: 12px; font-weight: 600; color: #374151; }
    .sk-input {
      border: 1.5px solid #e5e7eb; border-radius: 8px;
      padding: 7px 10px; font-size: 13.5px; font-family: inherit;
      color: #111827; outline: none;
      transition: border-color 0.15s;
    }
    .sk-input:focus { border-color: var(--primary); }
    .sk-textarea {
      border: 1.5px solid #e5e7eb; border-radius: 8px;
      padding: 8px 10px; font-size: 13px; font-family: inherit;
      color: #111827; outline: none; resize: vertical;
      min-height: 80px;
      transition: border-color 0.15s;
    }
    .sk-textarea:focus { border-color: var(--primary); }
    .sk-form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .sk-btn-cancel {
      background: none; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 7px 16px; font-size: 13px; color: #6b7280;
      cursor: pointer; font-family: inherit; transition: all 0.12s;
    }
    .sk-btn-cancel:hover { background: #f9fafb; }
    .sk-btn-save {
      background: var(--send-bg); border: none; border-radius: 8px;
      padding: 7px 18px; font-size: 13px; color: white;
      cursor: pointer; font-family: inherit; font-weight: 600;
      transition: background 0.12s;
    }
    .sk-btn-save:hover { background: var(--send-hover); }

    /* ─── IMAGE PREVIEW in input ─── */
    .img-preview-wrap {
      padding: 8px 12px 2px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .img-thumb {
      position: relative;
      width: 56px; height: 56px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    .img-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .img-thumb-del {
      position: absolute; top: 2px; right: 2px;
      background: rgba(0,0,0,0.55);
      border: none;
      border-radius: 50%;
      width: 16px; height: 16px;
      color: white;
      font-size: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }

    /* ─── SKILL SLASH DROPDOWN ─── */
    .slash-drop {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0; right: 0;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      z-index: 100;
    }
    .slash-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .slash-item:hover, .slash-item.active { background: #f3f4f6; }
    .slash-icon { font-size: 15px; width: 22px; text-align: center; flex-shrink: 0; }
    .slash-name { font-size: 13px; font-weight: 600; color: #111827; }
    .slash-desc { font-size: 11.5px; color: #6b7280; margin-left: 4px; }

    /* Image in chat bubble */

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      display: flex; align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }

    /* ─── UTILS ─── */
    .hidden { display: none !important; }

    /* ─── MOBILE ─── */
    @media (max-width: 768px) {
      .csb {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        z-index: 200;
        transform: translateX(-100%);
      }
      .csb.open { transform: translateX(0); }

      .mob-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 199;
      }
      .mob-overlay.show { display: block; }

      .mob-btn {
        position: fixed;
        top: 13px; left: 14px;
        z-index: 198;
        background: white;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      }

      .msg-row { padding: 5px 14px; }
      .input-wrap { padding: 10px 14px 16px; }
      .welcome { padding: 40px 20px 180px; }
      .welcome-title { font-size: 22px; }
    }

    @media (max-width: 480px) {
      .welcome-chips { gap: 6px; }
      .chip { font-size: 12px; padding: 7px 13px; }
    }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<script type="module">
import { requireAuth } from './js/auth.js';
import { getSupabase } from './js/supabase.js';

// ── SKILLS ──
const SKILLS = [
  { id: 'rangkum',      icon: '📝', name: 'rangkum',      desc: 'Rangkum teks panjang jadi poin utama',   prompt: 'Rangkum teks berikut ini menjadi poin-poin utama yang singkat dan mudah dipahami:\n\n' },
  { id: 'perbaiki',     icon: '✍️', name: 'perbaiki',     desc: 'Perbaiki tulisan agar lebih baik',        prompt: 'Perbaiki tulisan berikut — perbaiki grammar, keterbacaan, dan alur kalimat tanpa mengubah makna:\n\n' },
  { id: 'terjemahkan',  icon: '🌐', name: 'terjemahkan',  desc: 'Terjemahkan ke bahasa lain',              prompt: 'Terjemahkan teks berikut ke bahasa Inggris (atau sebutkan target bahasa lain):\n\n' },
  { id: 'brainstorm',   icon: '🧠', name: 'brainstorm',   desc: 'Brainstorm ide kreatif',                  prompt: 'Bantu saya brainstorm ide-ide kreatif untuk:\n\n' },
  { id: 'jelaskan',     icon: '💡', name: 'jelaskan',     desc: 'Jelaskan konsep dengan mudah',            prompt: 'Jelaskan konsep berikut dengan bahasa yang sederhana dan mudah dipahami:\n\n' },
  { id: 'buatkan-tabel',icon: '📊', name: 'buatkan-tabel',desc: 'Buat perbandingan dalam format tabel',    prompt: 'Buatkan tabel perbandingan yang jelas untuk:\n\n' },
  { id: 'debug-kode',   icon: '💻', name: 'debug-kode',   desc: 'Debug dan perbaiki kode',                 prompt: 'Tolong bantu debug kode berikut, jelaskan masalahnya dan berikan solusi:\n\n```\n\n```' },
  { id: 'video-scene-image-prompts', icon: '🎬', name: 'video-scene-image-prompts', desc: 'Generate image prompts dari frame/scene video', prompt: 'Analisa frame video/gambar yang dilampirkan dan lakukan:\n\n1. **Deskripsi Scene** — subjek, latar, komposisi, pencahayaan, warna dominan\n2. **Mood & Tone** — feel dari visual ini\n3. **Image Generation Prompts** — 3 prompt siap pakai untuk Midjourney / DALL-E:\n   - Prompt 1: Versi realistik\n   - Prompt 2: Versi cinematic/editorial\n   - Prompt 3: Versi bold/stylized\n4. **Saran Penggunaan** — cocok untuk konten apa?\n\nLampirkan foto/frame video, lalu ketik konteks singkat:' },
];

// ── STATE ──
const STORE = 'adsy_claude_chats_v2';
const MAX   = 60;
let convs   = {};       // { id: { id, title, msgs:[], ts } }
let curId   = null;
let busy    = false;
let userInitial = 'U';
let attachedImages = []; // [{ base64, mime_type, dataUrl, name }]

// ── INIT ──
async function init() {
  const sb = await getSupabase();
  const session = await requireAuth();
  if (!session) return;

  try {
    const { data: p } = await sb.from('profiles').select('name').eq('id', session.user.id).single();
    const name = p?.name || session.user.email || 'User';
    document.getElementById('csb-un').textContent = name;
    userInitial = name[0].toUpperCase();
    document.getElementById('csb-av').textContent = userInitial;
  } catch {}

  loadStore();
  setupInput();
}

// ── STORAGE ──
function loadStore() {
  try { convs = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch { convs = {}; }
  renderList();
}

function saveStore() {
  const arr = Object.values(convs).sort((a,b) => b.ts - a.ts);
  if (arr.length > MAX) {
    convs = {};
    arr.slice(0, MAX).forEach(c => convs[c.id] = c);
  }
  localStorage.setItem(STORE, JSON.stringify(convs));
}

// ── CONV LIST ──
function renderList() {
  const el = document.getElementById('conv-list');
  const arr = Object.values(convs).sort((a,b) => b.ts - a.ts);

  if (!arr.length) {
    el.innerHTML = `<div class="conv-empty">Belum ada riwayat.<br/>Mulai chat baru di atas.</div>`;
    return;
  }

  el.innerHTML = arr.map(c => `
    <div class="conv-item ${c.id === curId ? 'active' : ''}" onclick="loadConv('${c.id}')">
      <span class="conv-icon">💬</span>
      <span class="conv-title">${esc(c.title)}</span>
      <button class="conv-del" onclick="event.stopPropagation();delConv('${c.id}')" title="Hapus">✕</button>
    </div>`).join('');
}

window.newChat = function() {
  curId = null;
  document.getElementById('welcome').classList.remove('hidden');
  document.getElementById('msgs').classList.add('hidden');
  document.getElementById('msgs').innerHTML = '';
  document.getElementById('ci').value = '';
  renderList();
  closeSb();
};

window.loadConv = function(id) {
  const c = convs[id];
  if (!c) return;
  curId = id;
  document.getElementById('welcome').classList.add('hidden');
  const msgsEl = document.getElementById('msgs');
  msgsEl.classList.remove('hidden');
  msgsEl.innerHTML = '';
  c.msgs.forEach(m => renderMsg(m.role, m.content, false));
  scrollBot();
  renderList();
  closeSb();
};

window.delConv = function(id) {
  delete convs[id];
  saveStore();
  if (curId === id) window.newChat();
  else renderList();
};

function ensureConv(firstMsg) {
  if (curId && convs[curId]) return convs[curId];
  const id = 'cv_' + Date.now();
  const title = firstMsg.length > 55 ? firstMsg.slice(0, 55) + '…' : firstMsg;
  convs[id] = { id, title, msgs: [], ts: Date.now() };
  curId = id;
  return convs[id];
}

// ── RENDER MESSAGE ──
function renderMsg(role, content, animate) {
  const msgsEl = document.getElementById('msgs');
  const isUser = role === 'user';

  const row = document.createElement('div');
  row.className = 'msg-row ' + (isUser ? 'user' : 'claude') + (animate ? ' msg-fadein' : '');

  const av = document.createElement('div');
  av.className = 'msg-av ' + (isUser ? 'av-user' : 'av-claude');
  av.textContent = isUser ? userInitial : '✦';

  const body = document.createElement('div');
  body.className = 'msg-body';

  if (!isUser) {
    const nameEl = document.createElement('div');
    nameEl.className = 'msg-name';
    nameEl.textContent = 'Claude';
    body.appendChild(nameEl);
  }

  const textEl = document.createElement('div');
  textEl.className = 'msg-text';

  if (isUser) {
    textEl.textContent = content;
  } else {
    textEl.innerHTML = parseMarkdown(content);
    processCodeBlocks(textEl);
  }

  body.appendChild(textEl);

  if (!isUser) {
    const acts = document.createElement('div');
    acts.className = 'msg-acts';
    acts.innerHTML = `<button class="msg-act" onclick="copyTxt(this, \`${escAttr(content)}\`)">📋 Salin</button>`;
    body.appendChild(acts);
  }

  row.appendChild(av);
  row.appendChild(body);
  msgsEl.appendChild(row);
  return { row, textEl };
}

function renderThinking() {
  const msgsEl = document.getElementById('msgs');
  const row = document.createElement('div');
  row.className = 'msg-row claude';
  row.id = 'thinking';
  row.innerHTML = `
    <div class="msg-av av-claude">✦</div>
    <div class="msg-body">
      <div class="msg-name">Claude</div>
      <div class="thinking"><div class="td"></div><div class="td"></div><div class="td"></div></div>
    </div>`;
  msgsEl.appendChild(row);
  scrollBot();
}

// ── SEND ──
window.send = async function() {
  if (busy) return;
  const ci = document.getElementById('ci');
  const text = ci.value.trim();
  if (!text) return;

  ci.value = '';
  autoH(ci);

  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('msgs').classList.remove('hidden');

  const conv = ensureConv(text);

  // Build content — with images/video frames if any
  const imgs = [...attachedImages];
  let finalText = text;
  if (imgs.some(i => i.isVideo)) {
    const videoNames = imgs.filter(i => i.isVideo).map(i => i.name).join(', ');
    finalText = `[Frame dari video: ${videoNames}]\n\n${text}`;
  }
  const userContent = imgs.length
    ? [ ...imgs.map(img => ({ type: 'image', source: { type: 'base64', media_type: img.mime_type, data: img.base64 } })),
        { type: 'text', text: finalText } ]
    : text;

  conv.msgs.push({ role: 'user', content: userContent });

  // Clear attached images
  attachedImages = [];
  renderImagePreviews();

  // Render user message + image thumbnails
  renderUserMsgWithImages(text, imgs);
  scrollBot();
  renderThinking();

  busy = true;
  document.getElementById('sbtn').disabled = true;

  try {
    const res = await fetch('/api/ai-copy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'claude_chat', messages: conv.msgs })
    });

    const data = await res.json();

    document.getElementById('thinking')?.remove();

    if (!res.ok || !data.ok) {
      const isRetryable = data.retryable || (data.error || '').toLowerCase().includes('tight') || (data.error || '').toLowerCase().includes('resources');
      showError(isRetryable ? `⏳ Server kie.ai sedang sibuk. Klik **Coba Lagi** untuk mencoba ulang.` : `❌ **Error:** ${data.error || 'Gagal dapat respons'}`, isRetryable, text, conv);
      return;
    }

    conv.msgs.push({ role: 'assistant', content: data.text });
    conv.ts = Date.now();
    saveStore();
    renderList();

    renderMsg('assistant', data.text, true);
    scrollBot();

  } catch (err) {
    document.getElementById('thinking')?.remove();
    showError(`❌ **Error:** ${err.message}`, false, null, null);
    scrollBot();
  } finally {
    busy = false;
    document.getElementById('sbtn').disabled = false;
  }
};

// ── RENDER USER MSG WITH IMAGES ──
function renderUserMsgWithImages(text, imgs) {
  const msgsEl = document.getElementById('msgs');
  const row = document.createElement('div');
  row.className = 'msg-row user msg-fadein';

  const av = document.createElement('div');
  av.className = 'msg-av av-user';
  av.textContent = userInitial;

  const body = document.createElement('div');
  body.className = 'msg-body';

  if (imgs.length) {
    const imgWrap = document.createElement('div');
    imgWrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;';
    imgs.forEach(img => {
      const el = document.createElement('img');
      el.src = img.dataUrl;
      el.className = 'chat-img';
      el.style.maxWidth = '160px';
      el.onclick = () => openLightbox(img.dataUrl);
      imgWrap.appendChild(el);
    });
    body.appendChild(imgWrap);
  }

  if (text) {
    const textEl = document.createElement('div');
    textEl.className = 'msg-text';
    textEl.textContent = text;
    body.appendChild(textEl);
  }

  row.appendChild(av);
  row.appendChild(body);
  msgsEl.appendChild(row);
}

// ── LIGHTBOX ──
function openLightbox(src) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<img src="${src}"/>`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}

// ── SHOW ERROR ──
function showError(msg, retryable, lastUserMsg, conv) {
  const msgsEl = document.getElementById('msgs');
  const row = document.createElement('div');
  row.className = 'msg-row claude msg-fadein';
  row.innerHTML = `
    <div class="msg-av av-claude">✦</div>
    <div class="msg-body">
      <div class="msg-name">Claude</div>
      <div class="msg-text" style="color:#b91c1c;">${parseMarkdown(msg)}</div>
      ${retryable ? `<div class="msg-acts" style="opacity:1;margin-top:10px;">
        <button class="msg-act" style="border-color:#d97706;color:#d97706;" id="retry-btn">🔄 Coba Lagi</button>
      </div>` : ''}
    </div>`;
  msgsEl.appendChild(row);
  scrollBot();

  if (retryable && lastUserMsg) {
    row.querySelector('#retry-btn')?.addEventListener('click', async () => {
      row.remove();
      renderThinking();
      busy = true;
      document.getElementById('sbtn').disabled = true;

      try {
        const res2 = await fetch('/api/ai-copy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'claude_chat', messages: conv.msgs })
        });
        const d2 = await res2.json();
        document.getElementById('thinking')?.remove();

        if (!res2.ok || !d2.ok) {
          showError(`⏳ Masih sibuk. Tunggu sebentar lalu coba lagi.`, true, lastUserMsg, conv);
          return;
        }

        conv.msgs.push({ role: 'assistant', content: d2.text });
        conv.ts = Date.now();
        saveStore();
        renderList();
        renderMsg('assistant', d2.text, true);
        scrollBot();
      } catch (e2) {
        document.getElementById('thinking')?.remove();
        showError(`❌ **Error:** ${e2.message}`, false, null, null);
      } finally {
        busy = false;
        document.getElementById('sbtn').disabled = false;
      }
    });
  }
}

// ── CHIP ──
window.useChip = function(el) {
  const text = el.textContent.replace(/^[^\s]+\s/, '');
  const ci = document.getElementById('ci');
  ci.value = text;
  ci.focus();
  autoH(ci);
};

// ── MARKDOWN ──
function parseMarkdown(text) {
  if (typeof marked === 'undefined') return esc(text).replace(/\n/g, '<br>');
  try {
    marked.setOptions({ breaks: true, gfm: true });
    return marked.parse(text);
  } catch { return esc(text).replace(/\n/g, '<br>'); }
}

function processCodeBlocks(el) {
  el.querySelectorAll('pre').forEach(pre => {
    const code = pre.querySelector('code');
    if (!code) return;

    const lang = (code.className.match(/language-(\w+)/) || [])[1] || '';

    // Apply highlight
    if (typeof hljs !== 'undefined') {
      try {
        if (lang && hljs.getLanguage(lang)) {
          code.innerHTML = hljs.highlight(code.textContent, { language: lang }).value;
        } else {
          hljs.highlightElement(code);
        }
      } catch {}
    }

    // Insert header
    const header = document.createElement('div');
    header.className = 'code-top';
    const rawCode = code.textContent;
    header.innerHTML = `
      <span class="code-lang-label">${lang || 'text'}</span>
      <button class="code-cp-btn">Copy</button>`;
    header.querySelector('button').onclick = () => {
      navigator.clipboard.writeText(rawCode).then(() => {
        header.querySelector('button').textContent = 'Copied!';
        setTimeout(() => header.querySelector('button').textContent = 'Copy', 2000);
      });
    };
    pre.insertBefore(header, code);
  });
}

// ── INPUT SETUP ──
function setupInput() {
  const ci = document.getElementById('ci');
  ci.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      if (!document.getElementById('slash-drop').classList.contains('hidden')) {
        e.preventDefault(); applySlashActive(); return;
      }
      e.preventDefault(); window.send();
    }
    if (e.key === 'Escape') closeAllMenus();
    if (e.key === 'ArrowDown') slashNav(1);
    if (e.key === 'ArrowUp')   slashNav(-1);
  });
  ci.addEventListener('input', () => { autoH(ci); handleSlashInput(ci.value); });

  // Keyboard shortcut ⌘U
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'u') { e.preventDefault(); triggerFileUpload(); }
  });

  // Click outside closes menus
  document.addEventListener('click', e => {
    if (!e.target.closest('.plus-wrap') && !e.target.closest('#slash-drop')) closeAllMenus();
  });

  // Init skills submenu
  renderSkillsSub();
}

// ── PLUS MENU ──
window.togglePlusMenu = function(e) {
  e.stopPropagation();
  const m = document.getElementById('plus-menu');
  m.classList.toggle('hidden');
};

window.showSkillsSub = function() { document.getElementById('skills-sub').classList.remove('hidden'); };
window.hideSkillsSub = function() {
  setTimeout(() => {
    const sub = document.getElementById('skills-sub');
    if (!sub.matches(':hover') && !document.getElementById('pm-skills').matches(':hover')) sub.classList.add('hidden');
  }, 100);
};

function closeAllMenus() {
  document.getElementById('plus-menu').classList.add('hidden');
  document.getElementById('skills-sub').classList.add('hidden');
  document.getElementById('slash-drop').classList.add('hidden');
}

function allSkills() {
  return [...SKILLS, ...loadCustomSkills()];
}

function loadCustomSkills() {
  try { return JSON.parse(localStorage.getItem('adsy_custom_skills') || '[]'); } catch { return []; }
}

function saveCustomSkills(arr) {
  localStorage.setItem('adsy_custom_skills', JSON.stringify(arr));
}

function renderSkillsSub() {
  const sub = document.getElementById('skills-sub');
  const customs = loadCustomSkills();
  const all = [...SKILLS, ...customs];

  sub.innerHTML = all.map(s => `
    <div class="ss-item" onclick="applySkill('${s.id}')">
      <span class="ss-icon">${s.icon}</span>
      <div><div class="ss-name">${s.name}</div><div class="ss-desc">${s.desc}</div></div>
    </div>`).join('')
  + `<div class="ss-divider"></div>
     <div class="ss-action" onclick="openSkModal()">⚙️ &nbsp;Manage skills</div>
     <div class="ss-action" onclick="openSkModal(true)">+ &nbsp;Tambah skill baru</div>`;
}

// ── MANAGE SKILLS MODAL ──
window.openSkModal = function(showForm = false) {
  closeAllMenus();
  document.getElementById('sk-modal-overlay').classList.remove('hidden');
  renderSkList();
  if (showForm) showAddForm();
};

window.closeSkModal = function(e) {
  if (e.target === document.getElementById('sk-modal-overlay')) closeSkModalBtn();
};

window.closeSkModalBtn = function() {
  document.getElementById('sk-modal-overlay').classList.add('hidden');
  document.getElementById('sk-form-wrap').innerHTML = '';
  renderSkillsSub();
};

function renderSkList() {
  const customs = loadCustomSkills();
  const el = document.getElementById('sk-list');

  let html = '';

  if (SKILLS.length) {
    html += `<div style="font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Skill Bawaan</div>`;
    html += SKILLS.map(s => `
      <div class="sk-card">
        <div class="sk-card-icon">${s.icon}</div>
        <div class="sk-card-info">
          <div class="sk-card-name">${esc(s.name)}</div>
          <div class="sk-card-desc">${esc(s.desc)}</div>
        </div>
        <span class="sk-card-badge">Bawaan</span>
      </div>`).join('');
  }

  if (customs.length) {
    html += `<div style="font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;">Skill Buatan Saya</div>`;
    html += customs.map((s, i) => `
      <div class="sk-card">
        <div class="sk-card-icon">${esc(s.icon)}</div>
        <div class="sk-card-info">
          <div class="sk-card-name">${esc(s.name)}</div>
          <div class="sk-card-desc">${esc(s.desc)}</div>
        </div>
        <div class="sk-card-actions">
          <button class="sk-card-btn" onclick="exportSkill(${i})" title="Download sebagai .skill">⬇</button>
          <button class="sk-card-btn" onclick="showEditForm(${i})">Edit</button>
          <button class="sk-card-btn del" onclick="deleteCustomSkill(${i})">Hapus</button>
        </div>
      </div>`).join('');
  }

  if (!customs.length) {
    html += `<div style="text-align:center;padding:20px;color:#9ca3af;font-size:13px;">Belum ada skill buatan.<br/>Klik tombol di bawah untuk menambah.</div>`;
  }

  el.innerHTML = html;
}

window.showAddForm = function() {
  renderSkForm(null, -1);
};

window.showEditForm = function(i) {
  const s = loadCustomSkills()[i];
  if (s) renderSkForm(s, i);
};

function renderSkForm(skill, idx) {
  const isEdit = idx >= 0;
  document.getElementById('sk-form-wrap').innerHTML = `
    <div class="sk-form" style="margin-top:16px;">
      <div style="font-size:13.5px;font-weight:700;color:#111827;margin-bottom:14px;">${isEdit ? '✏️ Edit Skill' : '✨ Skill Baru'}</div>
      <div class="sk-form-row">
        <div class="sk-form-group icon-group">
          <label class="sk-label">Ikon</label>
          <input class="sk-input" id="sk-icon" placeholder="🎯" value="${skill?.icon || ''}" style="text-align:center;font-size:20px;"/>
        </div>
        <div class="sk-form-group">
          <label class="sk-label">Nama <span style="color:#ef4444">*</span></label>
          <input class="sk-input" id="sk-name" placeholder="nama-skill-kamu" value="${skill ? esc(skill.name) : ''}"/>
        </div>
      </div>
      <div class="sk-form-group" style="margin-bottom:12px;">
        <label class="sk-label">Deskripsi singkat</label>
        <input class="sk-input" id="sk-desc" placeholder="Apa yang skill ini lakukan?" value="${skill ? esc(skill.desc) : ''}"/>
      </div>
      <div class="sk-form-group" style="margin-bottom:14px;">
        <label class="sk-label">Prompt template <span style="color:#ef4444">*</span></label>
        <textarea class="sk-textarea" id="sk-prompt" placeholder="Tulis prompt... bisa diakhiri dengan ':' biar user tinggal lanjutkan">${skill ? esc(skill.prompt) : ''}</textarea>
      </div>
      <div class="sk-form-actions">
        <button class="sk-btn-cancel" onclick="cancelSkForm()">Batal</button>
        <button class="sk-btn-save" onclick="saveSkForm(${idx})">${isEdit ? '💾 Simpan' : '✅ Tambahkan'}</button>
      </div>
    </div>`;
  document.getElementById('sk-form-wrap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

window.cancelSkForm = function() {
  document.getElementById('sk-form-wrap').innerHTML = '';
};

window.saveSkForm = function(idx) {
  const icon  = document.getElementById('sk-icon').value.trim() || '⚡';
  const name  = document.getElementById('sk-name').value.trim();
  const desc  = document.getElementById('sk-desc').value.trim();
  const prompt = document.getElementById('sk-prompt').value.trim();

  if (!name) { document.getElementById('sk-name').focus(); return; }
  if (!prompt) { document.getElementById('sk-prompt').focus(); return; }

  // Sanitize name: lowercase, no spaces
  const id = name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');

  const customs = loadCustomSkills();
  const skill = { id: 'custom_' + id + '_' + Date.now(), icon, name: id, desc: desc || name, prompt };

  if (idx >= 0) {
    skill.id = customs[idx].id; // keep original id
    skill.name = name; // allow spaces in display but use as-is
    customs[idx] = skill;
  } else {
    skill.name = name;
    customs.push(skill);
  }

  saveCustomSkills(customs);
  document.getElementById('sk-form-wrap').innerHTML = '';
  renderSkList();
};

window.deleteCustomSkill = function(i) {
  if (!confirm('Hapus skill ini?')) return;
  const customs = loadCustomSkills();
  customs.splice(i, 1);
  saveCustomSkills(customs);
  renderSkList();
};

// ── IMPORT / EXPORT SKILL ──
window.triggerSkillImport = function() {
  document.getElementById('skill-file-input').click();
};

window.importSkillFile = function(files) {
  if (!files?.length) return;
  const file = files[0];
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);

      // Support single skill or array
      const items = Array.isArray(data) ? data
        : data.skills ? data.skills
        : data.format === 'adsy-skill' || data.icon || data.name ? [data]
        : null;

      if (!items) throw new Error('Format file tidak dikenal');

      const customs = loadCustomSkills();
      let added = 0;

      for (const s of items) {
        if (!s.name || !s.prompt) continue;
        // Skip duplikat berdasarkan name
        if (customs.find(c => c.name === s.name)) continue;
        customs.push({
          id: 'custom_' + s.name.replace(/\s+/g,'-') + '_' + Date.now(),
          icon: s.icon || '⚡',
          name: s.name,
          desc: s.desc || s.name,
          prompt: s.prompt
        });
        added++;
      }

      saveCustomSkills(customs);
      renderSkList();
      renderSkillsSub();
      document.getElementById('skill-file-input').value = '';

      // Feedback
      const foot = document.querySelector('.sk-modal-foot');
      const toast = document.createElement('div');
      toast.style.cssText = 'font-size:12px;color:#16a34a;text-align:center;padding:4px 0;';
      toast.textContent = added ? `✅ ${added} skill berhasil diimport!` : '⚠️ Skill sudah ada atau format tidak valid';
      foot.insertAdjacentElement('beforebegin', toast);
      setTimeout(() => toast.remove(), 3000);

    } catch (err) {
      alert('Gagal import: ' + err.message);
    }
  };
  reader.readAsText(file);
};

window.exportSkill = function(i) {
  const s = loadCustomSkills()[i];
  if (!s) return;
  const payload = { format: 'adsy-skill', version: 1, icon: s.icon, name: s.name, desc: s.desc, prompt: s.prompt };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${s.name.replace(/\s+/g,'-')}.skill`;
  a.click();
  URL.revokeObjectURL(a.href);
};

window.applySkill = function(id) {
  const s = SKILLS.find(x => x.id === id);
  if (!s) return;
  const ci = document.getElementById('ci');
  ci.value = s.prompt;
  ci.focus();
  autoH(ci);
  // Move cursor to end
  ci.setSelectionRange(ci.value.length, ci.value.length);
  closeAllMenus();
};

// ── SLASH COMMAND ──
let slashIdx = 0;
let slashFiltered = [];

function handleSlashInput(val) {
  const drop = document.getElementById('slash-drop');
  if (!val.startsWith('/')) { drop.classList.add('hidden'); return; }

  const query = val.slice(1).toLowerCase();
  slashFiltered = allSkills().filter(s => s.id.includes(query) || s.desc.toLowerCase().includes(query));

  if (!slashFiltered.length) { drop.classList.add('hidden'); return; }
  slashIdx = 0;
  renderSlashDrop();
  drop.classList.remove('hidden');
}

function renderSlashDrop() {
  document.getElementById('slash-drop').innerHTML = slashFiltered.map((s, i) => `
    <div class="slash-item ${i === slashIdx ? 'active' : ''}" onclick="applySlashItem(${i})">
      <span class="slash-icon">${s.icon}</span>
      <span class="slash-name">${s.name}</span>
      <span class="slash-desc">— ${s.desc}</span>
    </div>`).join('');
}

function slashNav(dir) {
  if (document.getElementById('slash-drop').classList.contains('hidden')) return;
  slashIdx = Math.max(0, Math.min(slashFiltered.length - 1, slashIdx + dir));
  renderSlashDrop();
}

function applySlashActive() { if (slashFiltered[slashIdx]) applySlashItem(slashIdx); }

window.applySlashItem = function(i) {
  const s = slashFiltered[i];
  if (!s) return;
  const ci = document.getElementById('ci');
  ci.value = s.prompt;
  ci.focus();
  autoH(ci);
  ci.setSelectionRange(ci.value.length, ci.value.length);
  document.getElementById('slash-drop').classList.add('hidden');
};

// ── FILE UPLOAD ──
window.triggerFileUpload = function() {
  document.getElementById('file-input').click();
  closeAllMenus();
};

window.handleFiles = async function(files) {
  for (const file of files) {
    if (attachedImages.length >= 4) break; // max 4

    if (file.type.startsWith('video/')) {
      // Extract frame dari video pakai Canvas
      try {
        const frame = await extractVideoFrame(file);
        attachedImages.push(frame);
      } catch (e) {
        console.warn('Gagal extract frame video:', e);
      }
    } else if (file.type.startsWith('image/')) {
      const b64 = await fileToBase64(file);
      const dataUrl = `data:${file.type};base64,${b64}`;
      attachedImages.push({ base64: b64, mime_type: file.type, dataUrl, name: file.name, isVideo: false });
    }
  }
  renderImagePreviews();
  document.getElementById('file-input').value = '';
};

function extractVideoFrame(file) {
  return new Promise((resolve, reject) => {
    const video  = document.createElement('video');
    const objUrl = URL.createObjectURL(file);
    video.src    = objUrl;
    video.muted  = true;
    video.playsInline = true;

    video.addEventListener('error', () => { URL.revokeObjectURL(objUrl); reject(new Error('Gagal load video')); });

    video.addEventListener('loadeddata', () => {
      // Seek ke detik ke-1 (atau awal kalau <1s)
      video.currentTime = Math.min(1, video.duration * 0.1);
    });

    video.addEventListener('seeked', () => {
      const canvas = document.createElement('canvas');
      // Max 1280px biar base64 tidak terlalu besar
      const scale  = Math.min(1, 1280 / video.videoWidth);
      canvas.width  = Math.round(video.videoWidth  * scale);
      canvas.height = Math.round(video.videoHeight * scale);
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const base64  = dataUrl.split(',')[1];
      URL.revokeObjectURL(objUrl);
      resolve({ base64, dataUrl, mime_type: 'image/jpeg', name: file.name, isVideo: true });
    });

    video.load();
  });
}

function fileToBase64(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = e => res(e.target.result.split(',')[1]);
    r.readAsDataURL(file);
  });
}

function renderImagePreviews() {
  const wrap = document.getElementById('img-previews');
  if (!attachedImages.length) { wrap.classList.add('hidden'); wrap.innerHTML = ''; return; }
  wrap.classList.remove('hidden');
  wrap.innerHTML = attachedImages.map((img, i) => `
    <div class="img-thumb">
      <img src="${img.dataUrl}" alt="${img.name}"/>
      ${img.isVideo ? `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.3);border-radius:8px;font-size:18px;pointer-events:none;">▶</div>` : ''}
      <button class="img-thumb-del" onclick="removeImg(${i})">✕</button>
    </div>`).join('');
}

window.removeImg = function(i) {
  attachedImages.splice(i, 1);
  renderImagePreviews();
};

function autoH(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

// ── SIDEBAR MOBILE ──
window.toggleSb = function() {
  document.getElementById('csb').classList.toggle('open');
  document.getElementById('mob-ov').classList.toggle('show');
};
window.closeSb = function() {
  document.getElementById('csb').classList.remove('open');
  document.getElementById('mob-ov').classList.remove('show');
};

// ── UTILS ──
window.copyTxt = function(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ Disalin!';
    setTimeout(() => btn.textContent = '📋 Salin', 2000);
  });
};

function scrollBot() {
  const el = document.getElementById('msgs');
  el.scrollTop = el.scrollHeight;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$');
}

init();
</script>
